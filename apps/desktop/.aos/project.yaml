# AOS project manifest — declarations for 'aos-app'.
#
# This file is COMMITTED TO GIT with the project, so it holds no secrets,
# no absolute paths, and no personal detail — only a one-line description
# and PATHS into the (private) vault.
#
# It declares; it never reports. There is deliberately no status, state,
# progress or last-updated field: those are derived by brief.py from tasks,
# git and sessions, and a hand-written copy would start rotting today.
schema: 1
id: aos-app
kind: mixed                 # ios | web | python | content | mixed
title: aos-app
description: null   # ONE line; detail goes in the vault docs below
done_when: null
appetite: null
initiative: null       # vault initiative key, not a path
goal: null

# Vault documents, RELATIVE to the vault root. Paths only — the vault
# stays private, this file does not.
docs: []

# Other AOS projects this one consumes, BY ID — never by path.
#
# This is how a dataset stays inside the project that owns it while
# the projects that read it still say so out loud. The alternative
# considered was a shared _data/ zone; it was cut because membership
# would then be declared twice — once by location, once here — and two
# signals for one fact is how drift starts.
depends_on: []

# Repo layout. Every path is RELATIVE to this project directory.
repos:
  root: .
  components: []

# Where branch checkouts live. Relative to this project, always —
# /private/tmp is wiped by the OS and has already destroyed 19 of them.
worktrees:
  location: .claude/worktrees
  naming: branch-slug
