# Shape of the dict produced by mapper.py (XML → dict). The engine client
# runs the mapper before applying response_map.
response_map:
  events: $.events[*]
  eta: $.eta
  event_fields:
    timestamp: $.timestamp
    code: $.code
    description: $.description
    location: $.location

rate_limits:
  # CPC throttles per API key (offenders blocked up to a minute); defaults
  # are per-key, so stay gentle. Tune after first live week.
  requests_per_day: 1000
  min_interval_seconds: 3

retention:
  delete_days_after_delivery: null
