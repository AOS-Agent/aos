# ─────────────────────────────────────────────────────────────────────────────
# Canada Post carrier pack (auto-tracker#19)
#
# Sources (researched 2026-07-24):
#   - developer-developpeur.canadapost-postescanada.ca — Track web service
#     (Get Tracking Details, REST, XML responses — hence mapper.py)
#   - Event identifiers: CPC "tracking scan events" code table
#   - Number format/check digit: jkeen/tracking_number_data couriers/canadapost.json
# ⚠ DOC-DERIVED: stays canary until a real captured response confirms the maps.
#   Canada Post approval is manual (days) — nothing is gated on this pack.
# ─────────────────────────────────────────────────────────────────────────────

carrier: canadapost
display_name: Canada Post

# API key = username:password pair, sent as HTTP Basic auth. Dev environment
# uses ct.soa-gw.canadapost.ca with separate dev keys (…_DEV suffix).
auth:
  model: basic
  keychain_keys:
    - CANADAPOST_API_USERNAME_PROD
    - CANADAPOST_API_PASSWORD_PROD

endpoints:
  base: https://soa-gw.canadapost.ca
  # GET with Accept: application/vnd.cpc.track-v2+xml — response is XML,
  # mapped to the response_map dict shape by mapper.py in this directory.
  track: https://soa-gw.canadapost.ca/rs/ship/track/pin/{number}/detail
  accept: application/vnd.cpc.track-v2+xml

tracking:
  patterns:
    - '[0-9]{16}'                 # domestic 16-digit PIN
    - '[A-Z]{2}[0-9]{9}CA'        # UPU S10 international (…CA)
  check_digit: canadapost_mod10

url_templates:
  - https://www.canadapost-postescanada.ca/track-reperage/en#/search?searchFor={number}
  - https://www.canadapost.ca/trackweb/en#/details/{number}

capabilities:
  edd: true    # expected-delivery-date / date-expected
  pod: true    # signature image flag + signatory name on delivery
  push: false  # no webhook — poll

