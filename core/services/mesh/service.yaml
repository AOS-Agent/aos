name: mesh
purpose: Mesh node daemon (meshd) — fleet health + agent-to-agent comms.
# Optional — part of the AOS Mesh initiative; deployed per-node as it rolls out.
#
# plist_template: null (aos#236.7) — this WILL be a LaunchAgent (keepalive,
# http liveness, a port — see below) but the initiative hasn't shipped its
# plist yet, and core/bin/internal/meshd, the wrapper main.py's own usage
# docstring names, doesn't exist either. The field used to say
# "com.aos.mesh.plist", which has never resolved anywhere — null is the
# honest "no framework plist yet" per the schema, not a fabricated path.
status: optional
type: resident
owner_layer: framework
label: com.aos.mesh
plist_template: null
keepalive: true
liveness: http
port: 4100
health_endpoint: /health
