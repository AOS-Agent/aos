name: whatsmeow
purpose: WhatsApp bridge (Go / whatsmeow) — relay for the comms WhatsApp adapter.
status: active
type: resident
owner_layer: framework
# Deployed under the com.agent.* prefix by the WhatsApp integration installer
# (core/infra/integrations/whatsapp/setup.sh), not from a config/launchagents
# template — hence plist_template: generated.
label: com.aos.whatsmeow   # was com.agent.* — the deployed plist has always been com.aos.*
plist_template: generated
keepalive: true
liveness: http
port: 7601
health_endpoint: /health

# Login Items display name (see core/infra/lib/launchers.py)
display_name: AOS WhatsApp
